services:
  mongodb:
    image: mongo:7.0
    container_name: job_feed_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }" || exit 1
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
